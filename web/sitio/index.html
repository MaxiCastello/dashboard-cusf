<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero · CUSF</title>
<link rel="icon" href="img/icono.png">
<link rel="stylesheet" href="css/fuentes.css">
<link rel="stylesheet" href="css/tablero.css">
<!-- defer: se ejecuta antes que el módulo (los dos esperan a que se lea la página, en este orden) -->
<script src="vendor/plotly-strict-3.4.0.min.js" defer></script>
<script type="module" src="js/inicio.js"></script>
</head>
<body data-pagina="tablero">
<header class="barra" id="barra"></header>
<main class="contenedor">
  <div class="enc" id="enc"></div>
  <div class="aviso error" id="aviso" role="alert" hidden></div>
  <p class="nota" id="cargando">Leyendo partidos…</p>
  <div class="columnas chico c-1-2" id="filtros" hidden>
    <div class="filtro" role="radiogroup" aria-labelledby="r-temporada">
      <p class="rotulo" id="r-temporada">Temporada</p>
      <div class="radios" id="anios"></div>
    </div>
    <div class="filtro" role="radiogroup" aria-labelledby="r-categoria" id="filtro-cat">
      <p class="rotulo" id="r-categoria">Categoría</p>
      <div class="radios" id="cats"></div>
    </div>
  </div>
  <div class="ver" id="caja-ver" hidden>
    <label class="rotulo" for="ver">Ver</label>
    <select id="ver"></select>
  </div>
  <div id="vista"></div>
</main>
</body>
</html>
